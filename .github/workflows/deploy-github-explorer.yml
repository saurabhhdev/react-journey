name: Deploy Nexhub to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "github-explorer/**"
      - ".github/workflows/deploy-github-explorer.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: github-explorer/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix github-explorer

      - name: Build Nexhub
        run: npm run build --prefix github-explorer

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: github-explorer/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
